[package]
name = "codebase-memory-rlm-rs"
version = "0.1.0"
edition = "2021"
description = "Rust code intelligence MCP server with RLM map-reduce orchestration"
license = "MIT"
readme = "README.md"

[lib]
name = "codebase_memory_rlm_rs"
path = "src/lib.rs"

[[bin]]
name = "codebase-memory-rlm"
path = "src/main.rs"

[dependencies]
rmcp = { version = "1.7", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
regex = "1"
ignore = "0.4"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
schemars = "1"
dirs = "6"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
uuid = { version = "1", features = ["v4"] }