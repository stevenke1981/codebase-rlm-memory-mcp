[package]
name = "codebase-rlm-memory-mcp"
version = "0.1.1"
edition = "2021"
description = "CBRLM — Rust code intelligence MCP with RLM map-reduce (codebase-rlm-memory-mcp)"
license = "MIT"
readme = "README.md"

[lib]
name = "codebase_rlm_memory_mcp"
path = "src/lib.rs"

[[bin]]
name = "cbrlm"
path = "src/main.rs"

[dependencies]
rmcp = { version = "1.7", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
regex = "1"
ignore = "0.4"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
schemars = "1"
dirs = "6"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true